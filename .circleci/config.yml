version: 2.1

orbs:
  python: circleci/python@2.1.1

jobs:
  build-and-test:
    docker:
      - image: cimg/python:3.10
    working_directory: ~/repo
    steps:
      - checkout

      - python/install-packages:
          pkg-manager: pip
          pip-dependency-file: requirements.txt

      - run:
          name: Import API (Sanity Check)
          command: |
            python - << 'EOF'
            import app
            print("FastAPI app imported successfully ✅")
            EOF

workflows:
  version: 2
  build:
    jobs:
      - build-and-test
