version: 2.1

orbs:
  python: circleci/python@2.1.1

jobs:
  build-and-test:
    docker:
      - image: cimg/python:3.11
    working_directory: ~/repo
    steps:
      - checkout

      - python/install-packages:
          pkg-manager: pip
          pip-dependency-file: requirements.txt

      - run:
          name: Import API (Sanity Check)
          command: python -c "import app; print('FastAPI app imported successfully')"

      - run:
          name: Run tests
          command: pytest -q

workflows:
  build:
    jobs:
      - build-and-test
