version: 2.1

jobs:
  build-and-test:
    docker:
      - image: cimg/python:3.11
      - image: cassandra:4.1
        environment:
          CASSANDRA_CLUSTER_NAME: test-cluster
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            python -m venv venv
            . venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
            pip install cqlsh
      - run:
          name: Wait for Cassandra
          command: |
            . venv/bin/activate
            # Wait up to 60s for Cassandra to be ready
            for i in {1..12}; do
              cqlsh localhost 9042 -e "DESCRIBE KEYSPACES" && break || sleep 5
            done
      - run:
          name: Run LDA Model Tests
          command: |
            . venv/bin/activate
            export CASSANDRA_HOST=localhost
            export PYTHONPATH=.
            pytest tests/test_basic.py

  deploy:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - run:
          name: Install AWS EB CLI
          command: pip install awsebcli
      - run:
          name: Deploy to AWS Elastic Beanstalk
          command: |
            # Matches your application name
            eb init customer-segmentation-api --platform docker --region $AWS_DEFAULT_REGION
            
            # Matches your exact Environment Name from the screenshot
            eb deploy Customer-segmentation-api

workflows:
  version: 2
  build-and-deploy:
    jobs:
      - build-and-test
      - deploy:
          requires:
            - build-and-test
          filters:
            branches:
              only: main